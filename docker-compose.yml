services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: deeptrace
      POSTGRES_PASSWORD: deeptrace
      POSTGRES_DB: deeptrace
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U deeptrace"], interval: 5s, retries: 10 }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, retries: 10 }

  agent:
    build: { context: ., dockerfile: docker/agent.Dockerfile }
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on: [postgres, redis]

  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: [.env]
    ports: ["3000:3000"]
    depends_on: [postgres, redis, agent]

  worker:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    depends_on: [postgres, redis, agent, api]

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    ports: ["5173:80"]
    depends_on: [api]

volumes: { pgdata: {} }
