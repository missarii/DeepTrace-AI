name: ci
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint && npm run typecheck && npm test -- --run
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  api:
    runs-on: ubuntu-latest
    services:
      postgres: { image: pgvector/pgvector:pg16, env: { POSTGRES_USER: deeptrace, POSTGRES_PASSWORD: deeptrace, POSTGRES_DB: deeptrace }, ports: ["5432:5432"] }
      redis: { image: redis:7-alpine, ports: ["6379:6379"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
        working-directory: apps/api
      - run: npm run lint && npm run typecheck && npm test
        working-directory: apps/api
        env: { DATABASE_URL: postgresql://deeptrace:deeptrace@localhost:5432/deeptrace?schema=public, REDIS_URL: redis://localhost:6379 }
  agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/agent/requirements.txt
      - run: ruff check apps/agent; python3 -m pytest apps/agent -q
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
